          - {go: tip,       runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: false}

          # ── freebsd/arm64 cross-build ──────────────────────────────────────
          - {go: '1.24.0',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.24.1',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.24.2',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.24.3',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.24.4',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.24.5',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.24.6',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.24.7',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.24.8',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.24.9',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.24.10', runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.24.11', runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.24.12', runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.24.13', runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.25.0',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.25.1',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.25.2',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.25.3',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.25.4',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.25.5',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.25.6',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.25.7',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.25.8',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.25.9',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.25.10', runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.26.0',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.26.1',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.26.2',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: '1.26.3',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: true}
          - {go: tip,       runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', required: false}

          # ── freebsd/386 cross-build ────────────────────────────────────────
          - {go: '1.24.0',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.24.1',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.24.2',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.24.3',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.24.4',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.24.5',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.24.6',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.24.7',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.24.8',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.24.9',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.24.10', runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.24.11', runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.24.12', runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.24.13', runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.25.0',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.25.1',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.25.2',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.25.3',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.25.4',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.25.5',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.25.6',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.25.7',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.25.8',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.25.9',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.25.10', runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.26.0',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.26.1',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.26.2',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: '1.26.3',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: true}
          - {go: tip,       runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', required: false}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        if: matrix.go != 'tip'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Set up bootstrap Go (for gotip only)
        if: matrix.go == 'tip'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install gotip
        if: matrix.go == 'tip'
        shell: bash
        run: |
          set -euo pipefail

          go install golang.org/dl/gotip@latest

          gobin="$(go env GOBIN)"
          if [ -z "$gobin" ]; then
            gobin="$(go env GOPATH)/bin"
          fi

          gotip_bin="$gobin/gotip"
          echo "$gobin" >> "$GITHUB_PATH"

          "$gotip_bin" download
          "$gotip_bin" version

      # FreeBSD: cross-compile only. No runner available; verify the build
      # compiles cleanly for each target but do not attempt to run tests.
      - name: Build
        if: matrix.go != 'tip'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build ./...

      - name: Build with gotip
        if: matrix.go == 'tip'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: gotip build ./...

  # ── Gate job ─────────────────────────────────────────────────────────────────
  all-required:
    name: All FreeBSD checks passed
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          result="${{ needs.test.result }}"
          if [ "$result" != "success" ]; then
            echo "One or more required FreeBSD build jobs failed (matrix result: $result)."
            exit 1
          fi
          echo "All required FreeBSD build jobs passed."
