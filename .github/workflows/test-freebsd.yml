name: Test (FreeBSD)

on:
  push:
    branches: ['**']
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Real FreeBSD VM tests — system Go from ports ──────────────────────────
  test-vm:
    name: Test / FreeBSD ${{ matrix.release }} / ${{ matrix.label }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.required }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── amd64 ──────────────────────────────────────────────────────────
          - {release: '13.5', arch: x86_64,  goarch: amd64,  label: freebsd-vm-13.5-amd64, required: true}
          - {release: '14.4', arch: x86_64,  goarch: amd64,  label: freebsd-vm-14.4-amd64, required: true}
          - {release: '15.0', arch: x86_64,  goarch: amd64,  label: freebsd-vm-15.0-amd64, required: true}
          # ── 386 (compat on amd64 VM) ───────────────────────────────────────
          - {release: '13.5', arch: x86_64,  goarch: '386',  label: freebsd-vm-13.5-386,   required: true}
          - {release: '14.4', arch: x86_64,  goarch: '386',  label: freebsd-vm-14.4-386,   required: true}
          - {release: '15.0', arch: x86_64,  goarch: '386',  label: freebsd-vm-15.0-386,   required: true}
          # ── arm64 (QEMU aarch64 VM) ────────────────────────────────────────
          - {release: '13.5', arch: aarch64, goarch: arm64,  label: freebsd-vm-13.5-arm64, required: true}
          - {release: '14.4', arch: aarch64, goarch: arm64,  label: freebsd-vm-14.4-arm64, required: true}
          - {release: '15.0', arch: aarch64, goarch: arm64,  label: freebsd-vm-15.0-arm64, required: true}
          # ── gotip (not required) ───────────────────────────────────────────
          - {release: '14.4', arch: x86_64,  goarch: amd64,  use_gotip: true, label: freebsd-vm-gotip-amd64, required: false}
          - {release: '14.4', arch: x86_64,  goarch: '386',  use_gotip: true, label: freebsd-vm-gotip-386,   required: false}
          - {release: '14.4', arch: aarch64, goarch: arm64,  use_gotip: true, label: freebsd-vm-gotip-arm64, required: false}

    steps:
      - uses: actions/checkout@v4

      - name: Test inside FreeBSD ${{ matrix.release }} / ${{ matrix.goarch }}
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          prepare: |
            pkg update -q
            pkg install -y go git ca_root_nss bash
          run: |
            set -eux
            freebsd-version
            uname -a
            go version
            go mod download

            GOARCH="${{ matrix.goarch }}"
            CGO_ENABLED="$( [ "$GOARCH" = "386" ] && echo 0 || echo 1 )"

            if [ "${{ matrix.use_gotip }}" = "true" ]; then
              GOBIN="$(go env GOPATH)/bin"
              export PATH="$GOBIN:$PATH"
              go install golang.org/dl/gotip@latest
              gotip download
              gotip version
              GOARCH="$GOARCH" CGO_ENABLED="$CGO_ENABLED" gotip test ./...
            else
              GOARCH="$GOARCH" CGO_ENABLED="$CGO_ENABLED" go test ./...
            fi

  # ── Gate job ─────────────────────────────────────────────────────────────────
  all-required:
    name: All FreeBSD checks passed
    needs: [test-vm]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          result="${{ needs.test-vm.result }}"
          if [ "$result" != "success" ]; then
            echo "One or more required FreeBSD test jobs failed (matrix result: $result)."
            exit 1
          fi
          echo "All required FreeBSD checks passed."
