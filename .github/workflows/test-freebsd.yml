name: Test (FreeBSD)

on:
  push:
    branches: ['**']
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Test / ${{ matrix.go }} / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}

    strategy:
      fail-fast: false
      matrix:
        include:

          # ── freebsd/amd64 cross-build ──────────────────────────────────────
          # No FreeBSD runners on GitHub's hosted plan; cross-compile only.
          # CGO_ENABLED=0 because there is no FreeBSD libc on the Linux runner.
          - {go: '1.24.0',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.24.1',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.24.2',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.24.3',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.24.4',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.24.5',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.24.6',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.24.7',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.24.8',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.24.9',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.24.10', runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.24.11', runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.24.12', runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.24.13', runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.25.0',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.25.1',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.25.2',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.25.3',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.25.4',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.25.5',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.25.6',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.25.7',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.25.8',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.25.9',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.25.10', runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.26.0',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.26.1',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
          - {go: '1.26.2',  runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', required: true}
