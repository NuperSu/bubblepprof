name: Test

on:
  push:
    branches: ['**']
  pull_request:

# Opt into Node.js 24 for all action runners. actions/checkout@v4,
# actions/setup-go@v5, and docker/setup-qemu-action@v3 still ship with
# Node.js 20 as their runtime; this flag forces the runner to execute them
# under Node.js 24 instead. Remove once the actions themselves declare
# node24 as their runtime in their action.yml files.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Test / ${{ matrix.go }} / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}

    strategy:
      fail-fast: false
      matrix:
        include:

          # ── linux/amd64 ────────────────────────────────────────────────────
          - {go: '1.24.0',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.24.13', runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.25.0',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.25.1',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.25.2',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.25.3',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.25.4',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.25.5',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.25.6',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.25.7',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.25.8',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.25.9',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.25.10', runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.26.0',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.26.1',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.26.2',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}
          - {go: '1.26.3',  runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: true}

          # ── linux/arm64 (native arm64 runner) ─────────────────────────────
