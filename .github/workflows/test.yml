name: Test

on:
  push:
    branches: ['**']
  pull_request:

# Opt into Node.js 24 for all action runners. actions/checkout@v4,
# actions/setup-go@v5, and docker/setup-qemu-action@v3 still ship with
# Node.js 20 as their runtime; this flag forces the runner to execute them
# under Node.js 24 instead. Remove once the actions themselves declare
# node24 as their runtime in their action.yml files.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Test / ${{ matrix.go }} / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    # Nice-to-have entries set required:false → continue-on-error:true, so they
    # don't block the gate job even when they fail.
    continue-on-error: ${{ !matrix.required }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Required: must-have platforms × minimum Go versions ──────────────
          #
          # linux/amd64 — native x86-64 runner
          - {go: '1.24.0', runner: ubuntu-latest,    goos: linux,   goarch: amd64, label: linux-amd64,   required: true}
          - {go: '1.25.0', runner: ubuntu-latest,    goos: linux,   goarch: amd64, label: linux-amd64,   required: true}
          - {go: '1.26.0', runner: ubuntu-latest,    goos: linux,   goarch: amd64, label: linux-amd64,   required: true}
          # linux/arm64 — native arm64 runner; faster and more reliable than QEMU.
          # ubuntu-22.04-arm is GitHub's hosted arm64 Linux runner.
          - {go: '1.24.0', runner: ubuntu-22.04-arm, goos: linux,   goarch: arm64, label: linux-arm64,   required: true}
          - {go: '1.25.0', runner: ubuntu-22.04-arm, goos: linux,   goarch: arm64, label: linux-arm64,   required: true}
          - {go: '1.26.0', runner: ubuntu-22.04-arm, goos: linux,   goarch: arm64, label: linux-arm64,   required: true}
          # darwin/amd64 — macos-13 is the last Intel runner; macos-14+ are M1/M2
          - {go: '1.24.0', runner: macos-13,         goos: darwin,  goarch: amd64, label: darwin-amd64,  required: true}
          - {go: '1.25.0', runner: macos-13,         goos: darwin,  goarch: amd64, label: darwin-amd64,  required: true}
          - {go: '1.26.0', runner: macos-13,         goos: darwin,  goarch: amd64, label: darwin-amd64,  required: true}
          # darwin/arm64 — macos-latest resolves to M1/M2 (arm64)
          - {go: '1.24.0', runner: macos-latest,     goos: darwin,  goarch: arm64, label: darwin-arm64,  required: true}
          - {go: '1.25.0', runner: macos-latest,     goos: darwin,  goarch: arm64, label: darwin-arm64,  required: true}
          - {go: '1.26.0', runner: macos-latest,     goos: darwin,  goarch: arm64, label: darwin-arm64,  required: true}
          # windows/amd64
          - {go: '1.24.0', runner: windows-latest,   goos: windows, goarch: amd64, label: windows-amd64, required: true}
          - {go: '1.25.0', runner: windows-latest,   goos: windows, goarch: amd64, label: windows-amd64, required: true}
          - {go: '1.26.0', runner: windows-latest,   goos: windows, goarch: amd64, label: windows-amd64, required: true}

          # ── Nice-to-have: go1.24.x patch versions (linux/amd64 as canary) ────
          - {go: '1.24.1', runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: false}
          - {go: '1.24.2', runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: false}
          - {go: '1.24.3', runner: ubuntu-latest, goos: linux, goarch: amd64, label: linux-amd64, required: false}

          # ── Nice-to-have: linux/386 ───────────────────────────────────────────
          # Pure-Go (CGO_ENABLED=0): x86-64 Linux can execute 32-bit x86 ELF
          # natively via the kernel's IA-32 emulation; no 32-bit libc needed.
          - {go: '1.24.0', runner: ubuntu-latest, goos: linux, goarch: '386', label: linux-386, cgo: '0', required: false}
          - {go: '1.25.0', runner: ubuntu-latest, goos: linux, goarch: '386', label: linux-386, cgo: '0', required: false}
          - {go: '1.26.0', runner: ubuntu-latest, goos: linux, goarch: '386', label: linux-386, cgo: '0', required: false}

          # ── Nice-to-have: linux/arm 32-bit via QEMU user-space ───────────────
          # docker/setup-qemu-action registers binfmt_misc handlers. Go cross-
          # compiles an ARMv7 binary; QEMU transparently executes it. GOARM=7
          # matches the verified linux/arm/v7 target in the runtimelayout table.
          - {go: '1.24.0', runner: ubuntu-latest, goos: linux, goarch: arm, goarm: '7', label: linux-arm, qemu: true, cgo: '0', required: false}
          - {go: '1.25.0', runner: ubuntu-latest, goos: linux, goarch: arm, goarm: '7', label: linux-arm, qemu: true, cgo: '0', required: false}
          - {go: '1.26.0', runner: ubuntu-latest, goos: linux, goarch: arm, goarm: '7', label: linux-arm, qemu: true, cgo: '0', required: false}

          # ── Nice-to-have: windows/386 ─────────────────────────────────────────
          - {go: '1.24.0', runner: windows-latest, goos: windows, goarch: '386', label: windows-386, required: false}
          - {go: '1.25.0', runner: windows-latest, goos: windows, goarch: '386', label: windows-386, required: false}
          - {go: '1.26.0', runner: windows-latest, goos: windows, goarch: '386', label: windows-386, required: false}

          # ── Nice-to-have: FreeBSD cross-build ────────────────────────────────
          # GitHub's free plan has no FreeBSD runners, so we can only verify that
          # the code compiles. go test cannot execute FreeBSD binaries on Linux.
          - {go: '1.24.0', runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', build-only: true, required: false}
          - {go: '1.25.0', runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', build-only: true, required: false}
          - {go: '1.26.0', runner: ubuntu-latest, goos: freebsd, goarch: amd64, label: freebsd-amd64, cgo: '0', build-only: true, required: false}
          - {go: '1.24.0', runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: false}
          - {go: '1.25.0', runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: false}
          - {go: '1.26.0', runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: false}
          - {go: '1.24.0', runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386,   cgo: '0', build-only: true, required: false}
          - {go: '1.25.0', runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386,   cgo: '0', build-only: true, required: false}
          - {go: '1.26.0', runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386,   cgo: '0', build-only: true, required: false}

    steps:
      - uses: actions/checkout@v4

      # Only installed for linux/arm 32-bit entries (qemu:true). linux/arm64 uses
      # a native runner, so QEMU is unnecessary there.
      - name: Set up QEMU
        if: matrix.qemu == true
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true  # caches the module download cache (~/.cache/go/mod)

      # Cross-compile check for targets where the binary cannot be executed on
      # the runner (FreeBSD). Verifies the code compiles cleanly; no tests run.
      - name: Build
        if: matrix.build-only == true
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo || '1' }}
        run: go build ./...

      - name: Test
        if: matrix.build-only != true
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # GOARM is empty for all non-arm entries; Go treats an empty value as
          # the default (GOARM=6). Arm entries override it to 7 via matrix.goarm.
          GOARM: ${{ matrix.goarm }}
          # matrix.cgo is '0' for cross-compile targets that lack 32-bit libc
          # (linux/386, linux/arm) and for FreeBSD. Native targets leave it unset,
          # which defaults to '1' here.
          CGO_ENABLED: ${{ matrix.cgo || '1' }}
        run: go test ./...

  # ── Gate job ─────────────────────────────────────────────────────────────────
  # Add "All required checks passed" as the single required status check in
  # branch protection. This avoids updating the required-check list every time
  # the matrix changes, and separates required failures from nice-to-have noise.
  #
  # needs.test.result is 'success' when all continue-on-error:false (required)
  # entries passed — even if continue-on-error:true (nice-to-have) entries failed.
  all-required:
    name: All required checks passed
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          result="${{ needs.test.result }}"
          if [ "$result" != "success" ]; then
            echo "One or more required test jobs failed (matrix result: $result)."
            exit 1
          fi
          echo "All required test jobs passed."
