          - {go: '1.25.2',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: true}
          - {go: '1.25.3',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: true}
          - {go: '1.25.4',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: true}
          - {go: '1.25.5',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: true}
          - {go: '1.25.6',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: true}
          - {go: '1.25.7',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: true}
          - {go: '1.25.8',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: true}
          - {go: '1.25.9',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: true}
          - {go: '1.25.10', runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: true}
          - {go: '1.26.0',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: true}
          - {go: '1.26.1',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: true}
          - {go: '1.26.2',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: true}
          - {go: '1.26.3',  runner: ubuntu-latest, goos: freebsd, goarch: arm64, label: freebsd-arm64, cgo: '0', build-only: true, required: true}

          # ── freebsd/386 cross-build ────────────────────────────────────────
          - {go: '1.24.0',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.24.13', runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.25.0',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.25.1',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.25.2',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.25.3',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.25.4',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.25.5',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.25.6',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.25.7',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.25.8',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.25.9',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.25.10', runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.26.0',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.26.1',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.26.2',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}
          - {go: '1.26.3',  runner: ubuntu-latest, goos: freebsd, goarch: '386', label: freebsd-386, cgo: '0', build-only: true, required: true}

          # ── gotip (Go development tip, HEAD) ──────────────────────────────
          # Non-required smoke tests against Go HEAD. go1.27-devel is already
          # in verifiedTable; these jobs surface layout regressions before a
          # release ships. All entries are required:false — failures are
          # informational only and never block merge.
          - {go: tip, runner: ubuntu-latest,    goos: linux,   goarch: amd64,  label: linux-amd64,   required: false}
          - {go: tip, runner: ubuntu-22.04-arm, goos: linux,   goarch: arm64,  label: linux-arm64,   required: false}
          - {go: tip, runner: ubuntu-latest,    goos: linux,   goarch: '386',  label: linux-386,     cgo: '0', required: false}
          - {go: tip, runner: ubuntu-latest,    goos: linux,   goarch: arm,    goarm: '7', label: linux-arm, qemu: true, cgo: '0', required: false}
          - {go: tip, runner: macos-13,         goos: darwin,  goarch: amd64,  label: darwin-amd64,  required: false}
          - {go: tip, runner: macos-latest,     goos: darwin,  goarch: arm64,  label: darwin-arm64,  required: false}
          - {go: tip, runner: windows-latest,   goos: windows, goarch: amd64,  label: windows-amd64, required: false}
          - {go: tip, runner: windows-latest,   goos: windows, goarch: '386',  label: windows-386,   required: false}
          - {go: tip, runner: ubuntu-latest,    goos: freebsd, goarch: amd64,  label: freebsd-amd64, cgo: '0', build-only: true, required: false}
          - {go: tip, runner: ubuntu-latest,    goos: freebsd, goarch: arm64,  label: freebsd-arm64, cgo: '0', build-only: true, required: false}
          - {go: tip, runner: ubuntu-latest,    goos: freebsd, goarch: '386',  label: freebsd-386,   cgo: '0', build-only: true, required: false}

    steps:
      - uses: actions/checkout@v4

      # Only installed for linux/arm 32-bit entries (qemu:true). linux/arm64 uses
      # a native runner, so QEMU is unnecessary there.
      - name: Set up QEMU
        if: matrix.qemu == true
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Go ${{ matrix.go }}
        if: matrix.go != 'tip'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Set up bootstrap Go (for gotip only)
        if: matrix.go == 'tip'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # Installs golang.org/dl/gotip via the bootstrap Go, then downloads
      # the development tree. gotip is called explicitly in Build/Test steps
      # below rather than shadowing 'go' via PATH, which is fragile.
      - name: Install gotip
        if: matrix.go == 'tip'
        shell: bash
        run: |
          set -euo pipefail

          go install golang.org/dl/gotip@latest

          gobin="$(go env GOBIN)"
          if [ -z "$gobin" ]; then
            gobin="$(go env GOPATH)/bin"
          fi

          if [ "$RUNNER_OS" = "Windows" ]; then
            gotip_bin="$(cygpath -u "$gobin")/gotip.exe"
            echo "$gobin" >> "$GITHUB_PATH"
          else
            gotip_bin="$gobin/gotip"
            echo "$gobin" >> "$GITHUB_PATH"
          fi

          "$gotip_bin" download
          "$gotip_bin" version

      # Cross-compile check for targets where the binary cannot be executed on
      # the runner (FreeBSD). Verifies the code compiles cleanly; no tests run.
      - name: Build
        if: matrix.build-only == true && matrix.go != 'tip'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ matrix.cgo || '1' }}
        run: go build ./...

      - name: Build with gotip
        if: matrix.build-only == true && matrix.go == 'tip'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ matrix.cgo || '1' }}
        run: gotip build ./...

      - name: Test
        if: matrix.build-only != true && matrix.go != 'tip'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # GOARM is empty for all non-arm entries; Go treats an empty value as
          # the default (GOARM=6). Arm entries override it to 7 via matrix.goarm.
          GOARM: ${{ matrix.goarm }}
          # matrix.cgo is '0' for cross-compile targets that lack 32-bit libc
          # (linux/386, linux/arm). Native targets leave it unset → defaults to '1'.
          CGO_ENABLED: ${{ matrix.cgo || '1' }}
        run: go test ./...

      - name: Test with gotip
        if: matrix.build-only != true && matrix.go == 'tip'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ matrix.cgo || '1' }}
        run: gotip test ./...

  # ── Gate job ─────────────────────────────────────────────────────────────────
  # Add "All required checks passed" as the single required status check in
  # branch protection. This avoids updating the required-check list every time
  # the matrix changes, and separates required failures from nice-to-have noise.
  #
  # needs.test.result is 'success' when all continue-on-error:false (required)
  # entries passed — even if continue-on-error:true (nice-to-have) entries failed.
  all-required:
    name: All required checks passed
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          result="${{ needs.test.result }}"
          if [ "$result" != "success" ]; then
            echo "One or more required test jobs failed (matrix result: $result)."
            exit 1
          fi
          echo "All required test jobs passed."
