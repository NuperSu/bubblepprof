name: Test (Darwin)

on:
  push:
    branches: ['**']
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Test / ${{ matrix.go }} / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}

    strategy:
      fail-fast: false
      matrix:
        include:

          # ── darwin/amd64 (macos-26-intel, Intel runner) ───────────────────
          - {go: '1.24.0',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.24.1',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.24.2',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.24.3',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.24.4',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.24.5',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.24.6',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.24.7',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.24.8',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.24.9',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.24.10', runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.24.11', runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.24.12', runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.24.13', runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.25.0',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.25.1',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.25.2',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.25.3',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.25.4',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.25.5',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.25.6',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.25.7',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.25.8',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.25.9',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.25.10', runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.26.0',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.26.1',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.26.2',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.26.3',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: tip,       runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: false}

          # ── darwin/arm64 (macos-latest = M-series) ────────────────────────
          - {go: '1.24.0',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.24.1',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.24.2',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.24.3',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.24.4',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.24.5',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.24.6',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.24.7',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.24.8',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.24.9',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.24.10', runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.24.11', runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.24.12', runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.24.13', runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.25.0',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.25.1',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.25.2',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.25.3',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.25.4',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.25.5',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.25.6',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.25.7',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.25.8',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.25.9',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.25.10', runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.26.0',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.26.1',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.26.2',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.26.3',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: tip,       runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: false}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        if: matrix.go != 'tip'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Set up bootstrap Go (for gotip only)
        if: matrix.go == 'tip'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install gotip
        if: matrix.go == 'tip'
        shell: bash
        run: |
          set -euo pipefail

          go install golang.org/dl/gotip@latest

          gobin="$(go env GOBIN)"
          if [ -z "$gobin" ]; then
            gobin="$(go env GOPATH)/bin"
          fi

          gotip_bin="$gobin/gotip"
          echo "$gobin" >> "$GITHUB_PATH"

          "$gotip_bin" download
          "$gotip_bin" version

      - name: Test
        if: matrix.go != 'tip'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go test ./...

      - name: Test with gotip
        if: matrix.go == 'tip'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: gotip test ./...

  # ── Gate job ─────────────────────────────────────────────────────────────────
  all-required:
    name: All Darwin checks passed
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          result="${{ needs.test.result }}"
          if [ "$result" != "success" ]; then
            echo "One or more required Darwin test jobs failed (matrix result: $result)."
            exit 1
          fi
          echo "All required Darwin test jobs passed."
