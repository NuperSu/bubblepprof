name: Test (Darwin)

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test / ${{ matrix.go }} / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}

    strategy:
      fail-fast: false
      matrix:
        include:

          # ── darwin/amd64 (macos-26-intel, Intel runner) ───────────────────
          - {go: '1.24.13',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.25.14',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.26.9',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: '1.27.2',  runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: true}
          - {go: tip,       runner: macos-26-intel, goos: darwin, goarch: amd64, label: darwin-amd64, required: false}

          # ── darwin/arm64 (macos-latest = M-series) ────────────────────────
          - {go: '1.24.13',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.25.14',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.26.9',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: '1.27.2',  runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: true}
          - {go: tip,       runner: macos-latest, goos: darwin, goarch: arm64, label: darwin-arm64, required: false}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go ${{ matrix.go }}
        if: matrix.go != 'tip'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Set up bootstrap Go (for gotip only)
        if: matrix.go == 'tip'
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install gotip
        if: matrix.go == 'tip'
        shell: bash
        run: |
          set -euo pipefail

          go install golang.org/dl/gotip@latest

          gobin="$(go env GOBIN)"
          if [ -z "$gobin" ]; then
            gobin="$(go env GOPATH)/bin"
          fi

          gotip_bin="$gobin/gotip"
          echo "$gobin" >> "$GITHUB_PATH"

          "$gotip_bin" download
          "$gotip_bin" version

      - name: Test
        if: matrix.go != 'tip'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        # -buildmode=pie exercises the address-space reader's PIE/ASLR slide
        # path on darwin (Mach-O __gopclntab probe).
        run: go test -buildmode=pie ./...

      - name: Test with gotip
        if: matrix.go == 'tip'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: gotip test -buildmode=pie ./...

  # ── Gate job ─────────────────────────────────────────────────────────────────
  all-required:
    name: All Darwin checks passed
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          result="${{ needs.test.result }}"
          if [ "$result" != "success" ]; then
            echo "One or more required Darwin test jobs failed (matrix result: $result)."
            exit 1
          fi
          echo "All required Darwin test jobs passed."
